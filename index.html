<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BOLT Closet</title>
    <!-- Tailwind CSS & FontAwesome -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body { background-color: #FAF7F2; color: #1C1917; font-family: 'Plus Jakarta Sans', sans-serif; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="min-h-screen pb-24 md:pb-6 antialiased">

    <div id="app" class="max-w-md md:max-w-4xl mx-auto min-h-screen bg-[#FAF7F2] relative shadow-2xl md:my-4 md:rounded-3xl overflow-hidden border border-stone-200/60">
        
        <!-- Header -->
        <header class="px-5 pt-6 pb-4 bg-[#FAF7F2] sticky top-0 z-20 border-b border-stone-200/50 flex justify-between items-center">
            <div>
                <h1 class="text-2xl md:text-3xl font-bold tracking-tight text-stone-900">BOLT Closet</h1>
                <p class="text-xs md:text-sm text-stone-500 font-medium">จัดระเบียบเสื้อผ้าและวางแผนการแต่งตัว</p>
            </div>
            <button onclick="openAddItemModal()" class="flex items-center gap-1.5 px-4 py-2.5 rounded-full bg-stone-900 text-white text-xs md:text-sm font-semibold shadow-md hover:bg-stone-800 transition active:scale-95">
                <i class="fa-solid fa-plus"></i>
                <span>Add Item</span>
            </button>
        </header>

        <!-- Sub Tabs -->
        <div class="px-5 pt-4 pb-2 bg-[#FAF7F2]">
            <div class="flex bg-stone-200/70 rounded-2xl p-1 gap-1">
                <button id="subtab-all-btn" onclick="switchSubTab('all')" class="flex-1 py-2.5 text-sm font-semibold rounded-xl bg-white shadow-sm text-stone-900 transition">ALL</button>
                <button id="subtab-items-btn" onclick="switchSubTab('items')" class="flex-1 py-2.5 text-sm font-semibold rounded-xl text-stone-600 transition">Items (<span id="count-items">0</span>)</button>
                <button id="subtab-outfits-btn" onclick="switchSubTab('outfits')" class="flex-1 py-2.5 text-sm font-semibold rounded-xl text-stone-600 transition">Outfits (<span id="count-outfits">0</span>)</button>
            </div>
        </div>

        <main class="p-4 md:p-6">
            <section id="tab-closet" class="tab-content block">
                <!-- SUB-TAB: ALL GRID -->
                <div id="subtab-all" class="space-y-4">
                    <div id="all-grid" class="grid grid-cols-2 md:grid-cols-4 gap-3 md:gap-4"></div>
                </div>

                <!-- SUB-TAB: ITEMS GRID -->
                <div id="subtab-items" class="hidden space-y-4">
                    <div class="flex items-center gap-2 overflow-x-auto hide-scrollbar py-1">
                        <button onclick="filterCategory('all')" class="cat-chip active px-3.5 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap bg-stone-900 text-white">ทั้งหมด</button>
                        <button onclick="filterCategory('tshirt')" class="cat-chip px-3.5 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap bg-white text-stone-600 border border-stone-200">👕 เสื้อ</button>
                        <button onclick="filterCategory('shirt')" class="cat-chip px-3.5 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap bg-white text-stone-600 border border-stone-200">👔 เสื้อเชิ้ต</button>
                        <button onclick="filterCategory('jacket')" class="cat-chip px-3.5 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap bg-white text-stone-600 border border-stone-200">🧥 แจ็คเก็ต</button>
                        <button onclick="filterCategory('pants')" class="cat-chip px-3.5 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap bg-white text-stone-600 border border-stone-200">👖 กางเกง</button>
                        <button onclick="filterCategory('shoes')" class="cat-chip px-3.5 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap bg-white text-stone-600 border border-stone-200">👟 รองเท้า</button>
                    </div>

                    <div class="relative">
                        <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-3 text-stone-400 text-sm"></i>
                        <input type="text" id="search-input" oninput="renderItems()" placeholder="ค้นหาเสื้อผ้า, แบรนด์, สี..." class="w-full pl-10 pr-4 py-2.5 rounded-2xl bg-white border border-stone-200 text-xs md:text-sm focus:outline-none">
                    </div>

                    <div id="items-grid" class="grid grid-cols-2 md:grid-cols-3 gap-3.5 md:gap-4"></div>
                </div>

                <!-- SUB-TAB: SAVED OUTFITS -->
                <div id="subtab-outfits" class="hidden space-y-4">
                    <div id="outfits-grid" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
                </div>
            </section>
        </main>

        <!-- ADD/EDIT ITEM MODAL -->
        <div id="add-item-modal" class="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 flex items-end md:items-center justify-center p-0 md:p-4 hidden">
            <div class="bg-white w-full max-w-md rounded-t-3xl md:rounded-3xl p-6 space-y-4 shadow-2xl">
                <div class="flex justify-between items-center border-b border-stone-100 pb-3">
                    <h3 id="modal-title-text" class="text-lg font-bold text-stone-800">เพิ่มเสื้อผ้าใหม่</h3>
                    <button onclick="closeAddItemModal()" class="w-8 h-8 rounded-full bg-stone-100 flex items-center justify-center text-stone-500">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                </div>

                <form id="add-item-form" onsubmit="handleSaveItem(event)" class="space-y-3">
                    <input type="hidden" id="edit-item-id">
                    <div>
                        <label class="text-xs font-semibold text-stone-700 mb-1 block">ชื่อรายการเสื้อผ้า *</label>
                        <input type="text" id="item-title" required placeholder="เช่น เสื้อโปโล, เสื้อเชิ้ต..." class="w-full p-2.5 rounded-xl border border-stone-200 text-xs">
                    </div>

                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="text-xs font-semibold text-stone-700 mb-1 block">หมวดหมู่ *</label>
                            <select id="item-category" required class="w-full p-2.5 rounded-xl border border-stone-200 text-xs">
                                <option value="tshirt">👕 เสื้อยืด/โปโล (T-shirt)</option>
                                <option value="shirt">👔 เสื้อเชิ้ต (Shirt)</option>
                                <option value="jacket">🧥 แจ็คเก็ต (Jacket)</option>
                                <option value="pants">👖 กางเกง (Pants)</option>
                                <option value="glasses">🕶️ แว่นตา (Glasses)</option>
                                <option value="shoes">👟 รองเท้า (Shoes)</option>
                            </select>
                        </div>
                        <div>
                            <label class="text-xs font-semibold text-stone-700 mb-1 block">แบรนด์</label>
                            <input type="text" id="item-brand" placeholder="เช่น ZARA, Uniqlo" class="w-full p-2.5 rounded-xl border border-stone-200 text-xs">
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="text-xs font-semibold text-stone-700 mb-1 block">โทนสี</label>
                            <input type="text" id="item-color" placeholder="เช่น น้ำตาล, Cream" class="w-full p-2.5 rounded-xl border border-stone-200 text-xs">
                        </div>
                        <div>
                            <label class="text-xs font-semibold text-stone-700 mb-1 block">รูปภาพ</label>
                            <input type="file" id="item-file" accept="image/*" onchange="previewImageFile(event)" class="text-[10px] text-stone-500">
                        </div>
                    </div>

                    <div id="image-preview-container" class="w-full h-28 rounded-xl border border-dashed border-stone-300 bg-stone-50 flex items-center justify-center overflow-hidden">
                        <img id="image-preview" src="" class="w-full h-full object-contain hidden">
                        <span id="image-placeholder-text" class="text-stone-400 text-xs"><i class="fa-regular fa-image mr-1"></i> ตัวอย่างรูปภาพ</span>
                    </div>

                    <div class="pt-2 flex gap-2">
                        <button type="button" onclick="closeAddItemModal()" class="flex-1 py-2.5 bg-stone-100 text-stone-700 rounded-xl text-xs font-semibold">ยกเลิก</button>
                        <button type="submit" class="flex-1 py-2.5 bg-stone-900 text-white rounded-xl text-xs font-semibold">บันทึกข้อมูล</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Notification Toast -->
        <div id="toast" class="fixed top-5 left-1/2 -translate-x-1/2 bg-stone-900 text-white px-4 py-2 rounded-full text-xs font-semibold shadow-xl opacity-0 transition-all pointer-events-none z-50 flex items-center gap-2">
            <i id="toast-icon" class="fa-solid fa-circle-check text-emerald-400"></i>
            <span id="toast-message">แจ้งเตือน</span>
        </div>
    </div>

    <script>
        let items = JSON.parse(localStorage.getItem('my_closet_items')) || [];
        let outfits = JSON.parse(localStorage.getItem('my_closet_outfits')) || [];
        let activeCategory = 'all';
        let uploadedImageBase64 = '';
        
        // ** ใส่ URL ของ Web App Google Apps Script ที่ได้จากการ Deploy ที่นี่ **
        let googleScriptUrl = 'https://script.google.com/macros/s/AKfycbxhEaVTs6it5yfm7Bcz8-jkhkUxBIHKqNkKWCF_gNUtXl7bsTipO8EkrS1ZlNPDPBPy/exec';

        window.onload = function() {
            renderAllItems();
            renderItems();
            updateCounts();
            loadItemsFromGoogle();
        };

        function switchSubTab(sub) {
            const allBtn = document.getElementById('subtab-all-btn');
            const itemsBtn = document.getElementById('subtab-items-btn');
            const outfitsBtn = document.getElementById('subtab-outfits-btn');
            
            const allDiv = document.getElementById('subtab-all');
            const itemsDiv = document.getElementById('subtab-items');
            const outfitsDiv = document.getElementById('subtab-outfits');

            [allBtn, itemsBtn, outfitsBtn].forEach(btn => btn.classList.remove('bg-white', 'shadow-sm', 'text-stone-900'));
            [allDiv, itemsDiv, outfitsDiv].forEach(div => div.classList.add('hidden'));

            if (sub === 'all') {
                allBtn.classList.add('bg-white', 'shadow-sm', 'text-stone-900');
                allDiv.classList.remove('hidden');
                renderAllItems();
            } else if (sub === 'items') {
                itemsBtn.classList.add('bg-white', 'shadow-sm', 'text-stone-900');
                itemsDiv.classList.remove('hidden');
                renderItems();
            } else {
                outfitsBtn.classList.add('bg-white', 'shadow-sm', 'text-stone-900');
                outfitsDiv.classList.remove('hidden');
            }
        }

        function renderAllItems() {
            const grid = document.getElementById('all-grid');
            grid.innerHTML = '';
            if(items.length === 0) {
                grid.innerHTML = `<div class="col-span-full py-10 text-center text-stone-400"><p class="text-xs">ไม่มีรายการเสื้อผ้า</p></div>`;
                return;
            }

            items.forEach(item => {
                const card = document.createElement('div');
                card.className = "bg-[#EFECE6] rounded-2xl p-2 h-48 md:h-56 flex items-center justify-center overflow-hidden cursor-pointer hover:shadow-md transition border border-stone-200/40";
                card.onclick = () => openItemDetail(item.id);

                const imageUrl = item.image ? item.image.replace('https://drive.google.com/uc?export=view&id=', 'https://drive.google.com/thumbnail?id=') + '&sz=w1000' : '';
                card.innerHTML = `<img src="${imageUrl}" class="w-full h-full object-contain p-1" onerror="this.src='https://placehold.co/300x300/F3EFEA/A8A29E?text=No+Image'">`;
                grid.appendChild(card);
            });
        }

        function renderItems() {
            const grid = document.getElementById('items-grid');
            const searchQuery = document.getElementById('search-input').value.toLowerCase();
            grid.innerHTML = '';

            const filtered = items.filter(item => {
                const matchCat = activeCategory === 'all' || item.category === activeCategory;
                const matchSearch = (item.title||'').toLowerCase().includes(searchQuery) || (item.brand||'').toLowerCase().includes(searchQuery);
                return matchCat && matchSearch;
            });

            filtered.forEach(item => {
                const card = document.createElement('div');
                card.className = "bg-white rounded-2xl p-2.5 shadow-sm border border-stone-200/80 flex flex-col justify-between relative group hover:shadow-md transition cursor-pointer";
                card.onclick = () => openItemDetail(item.id);
                
                const imageUrl = item.image ? item.image.replace('https://drive.google.com/uc?export=view&id=', 'https://drive.google.com/thumbnail?id=') + '&sz=w1000' : '';
                card.innerHTML = `
                    <div class="w-full h-36 rounded-xl bg-[#F7F5F0] overflow-hidden mb-2 flex items-center justify-center">
                        <img src="${imageUrl}" class="w-full h-full object-contain p-2 hover:scale-105 transition" onerror="this.src='https://placehold.co/300x300/F3EFEA/A8A29E?text=No+Image'">
                    </div>
                    <div>
                        <h4 class="text-xs font-bold text-stone-800 line-clamp-1">${item.title}</h4>
                        <p class="text-[11px] text-stone-400">${item.brand || 'unknow'}</p>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // Modal รายละเอียดสินค้า (รวมปุ่มแก้ไข + ปุ่มลบ + ปุ่ม X)
        function openItemDetail(itemId) {
            const item = items.find(i => String(i.id) === String(itemId));
            if (!item) return;

            const imageUrl = item.image ? item.image.replace('https://drive.google.com/uc?export=view&id=', 'https://drive.google.com/thumbnail?id=') + '&sz=w2000' : '';

            const modal = document.createElement('div');
            modal.id = 'item-detail-modal';
            modal.className = 'fixed inset-0 z-[9999] bg-black/60 backdrop-blur-sm flex items-center justify-center p-4';
            modal.innerHTML = `
                <div class="bg-white rounded-3xl w-full max-w-sm overflow-hidden shadow-2xl relative animate-in fade-in zoom-in duration-200">
                    <!-- ปุ่ม X ปิดมุมบนขวา -->
                    <button onclick="document.getElementById('item-detail-modal').remove()" class="absolute top-4 right-4 z-20 w-8 h-8 rounded-full bg-stone-100 flex items-center justify-center text-stone-500 hover:bg-stone-200 text-sm">
                        <i class="fa-solid fa-xmark"></i>
                    </button>

                    <div class="p-4">
                        <!-- กรอบรูปภาพ -->
                        <div class="w-full h-72 rounded-2xl bg-[#F7F5F0] flex items-center justify-center overflow-hidden mb-4 relative">
                            ${imageUrl ? `<img src="${imageUrl}" class="w-full h-full object-contain p-2" alt="${item.title}">` : `<div class="text-stone-400">ไม่มีรูปภาพ</div>`}
                        </div>

                        <!-- ส่วนหัว + ปุ่มลบ & ดินสอ -->
                        <div class="flex justify-between items-start mb-3">
                            <div>
                                <h2 class="text-xl font-bold text-stone-900 leading-tight">${item.title || 'ไม่มีชื่อ'}</h2>
                                <p class="text-xs text-stone-400 mt-0.5">${item.brand || 'unknow'}</p>
                            </div>

                            <div class="flex items-center gap-2">
                                <!-- ปุ่มลบ (ถังขยะ) -->
                                <button onclick="deleteItem('${item.id}')" title="ลบสินค้า" class="w-9 h-9 rounded-full bg-rose-500 hover:bg-rose-600 text-white flex items-center justify-center transition shadow-sm">
                                    <i class="fa-solid fa-trash-can text-xs"></i>
                                </button>
                                <!-- ปุ่มดินสอ (แก้ไข) -->
                                <button onclick="openEditItemModal('${item.id}')" title="แก้ไขสินค้า" class="w-9 h-9 rounded-full bg-stone-900 hover:bg-stone-800 text-white flex items-center justify-center transition shadow-sm">
                                    <i class="fa-solid fa-pencil text-xs"></i>
                                </button>
                            </div>
                        </div>

                        <!-- ตารางรายละเอียด -->
                        <div class="space-y-2 text-xs border-t border-stone-100 pt-3">
                            <div class="flex justify-between py-1 border-b border-stone-50">
                                <span class="text-stone-400">หมวดหมู่</span>
                                <span class="font-semibold text-stone-800">${item.category || '-'}</span>
                            </div>
                            <div class="flex justify-between py-1 border-b border-stone-50">
                                <span class="text-stone-400">โทนสี</span>
                                <span class="font-semibold text-stone-800">${item.color || '-'}</span>
                            </div>
                            <div class="flex justify-between py-1">
                                <span class="text-stone-400">แบรนด์</span>
                                <span class="font-semibold text-stone-800">${item.brand || 'unknow'}</span>
                            </div>
                        </div>
                    </div>
                </div>
            `;
            document.body.appendChild(modal);

            modal.addEventListener('click', function(e) {
                if (e.target === modal) modal.remove();
            });
        }

        // เปิด Modal เมื่อกดดินสอแก้ไข
        function openEditItemModal(itemId) {
            const item = items.find(i => String(i.id) === String(itemId));
            if (!item) return;

            // ปิด Modal รายละเอียดเดิม
            const detailModal = document.getElementById('item-detail-modal');
            if (detailModal) detailModal.remove();

            document.getElementById('modal-title-text').innerText = "แก้ไขเสื้อผ้า";
            document.getElementById('edit-item-id').value = item.id;
            document.getElementById('item-title').value = item.title || '';
            document.getElementById('item-category').value = item.category || 'tshirt';
            document.getElementById('item-brand').value = item.brand || '';
            document.getElementById('item-color').value = item.color || '';

            if (item.image) {
                const preview = document.getElementById('image-preview');
                preview.src = item.image.replace('https://drive.google.com/uc?export=view&id=', 'https://drive.google.com/thumbnail?id=');
                preview.classList.remove('hidden');
                document.getElementById('image-placeholder-text').classList.add('hidden');
            }

            document.getElementById('add-item-modal').classList.remove('hidden');
        }

        function openAddItemModal() {
            document.getElementById('modal-title-text').innerText = "เพิ่มเสื้อผ้าใหม่";
            document.getElementById('edit-item-id').value = "";
            document.getElementById('add-item-form').reset();
            uploadedImageBase64 = '';
            document.getElementById('image-preview').classList.add('hidden');
            document.getElementById('image-placeholder-text').classList.remove('hidden');
            document.getElementById('add-item-modal').classList.remove('hidden');
        }

        function closeAddItemModal() {
            document.getElementById('add-item-modal').classList.add('hidden');
        }

        function previewImageFile(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(evt) {
                uploadedImageBase64 = evt.target.result;
                const preview = document.getElementById('image-preview');
                preview.src = uploadedImageBase64;
                preview.classList.remove('hidden');
                document.getElementById('image-placeholder-text').classList.add('hidden');
            };
            reader.readAsDataURL(file);
        }

        // บันทึกทั้งเคส "เพิ่มใหม่" และ "แก้ไข"
        function handleSaveItem(e) {
            e.preventDefault();
            const editId = document.getElementById('edit-item-id').value;
            const title = document.getElementById('item-title').value;
            const category = document.getElementById('item-category').value;
            const brand = document.getElementById('item-brand').value;
            const color = document.getElementById('item-color').value;

            if (editId) {
                // เคสแก้ไข
                const item = items.find(i => String(i.id) === String(editId));
                if (item) {
                    item.title = title;
                    item.category = category;
                    item.brand = brand;
                    item.color = color;
                    if (uploadedImageBase64) item.image = uploadedImageBase64;

                    saveData();
                    renderAllItems();
                    renderItems();
                    closeAddItemModal();
                    showToast('กำลังอัปเดตข้อมูลบน Google Drive...');

                    if (googleScriptUrl) {
                        fetch(googleScriptUrl, {
                            method: 'POST',
                            mode: 'no-cors',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ action: 'update_item', item: item })
                        }).then(() => showToast('✅ แก้ไขเสื้อผ้าเรียบร้อยแล้ว'));
                    }
                }
            } else {
                // เคสเพิ่มใหม่
                const newItem = {
                    id: Date.now().toString(),
                    title: title,
                    category: category,
                    brand: brand || 'unknow',
                    color: color || '-',
                    image: uploadedImageBase64 || '',
                    favorite: false
                };

                items.unshift(newItem);
                saveData();
                renderAllItems();
                renderItems();
                updateCounts();
                closeAddItemModal();
                showToast('กำลังบันทึกไป Google Drive...');

                if (googleScriptUrl) {
                    fetch(googleScriptUrl, {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ action: 'add_item', item: newItem })
                    }).then(() => showToast('✅ บันทึกเรียบร้อย'));
                }
            }
        }

        async function deleteItem(id) {
            const item = items.find(i => String(i.id) === String(id));
            if (!item) return;

            if (!confirm(`ยืนยันการลบ "${item.title}" หรือไม่?`)) return;

            items = items.filter(i => String(i.id) !== String(id));
            saveData();
            renderAllItems();
            renderItems();
            updateCounts();

            const detailModal = document.getElementById('item-detail-modal');
            if (detailModal) detailModal.remove();

            showToast('กำลังลบข้อมูล...');
            if (googleScriptUrl) {
                fetch(googleScriptUrl, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'delete_item', id: String(id) })
                }).then(() => showToast('✅ ลบเรียบร้อยแล้ว'));
            }
        }

        async function loadItemsFromGoogle() {
            if (!googleScriptUrl) return;

            try {
                showToast('กำลังดึงข้อมูลล่าสุด...');
                const response = await fetch(googleScriptUrl);
                const data = await response.json();

                if (data.status === 'success') {
                    if (Array.isArray(data.items)) items = data.items;
                    if (Array.isArray(data.outfits)) outfits = data.outfits;

                    saveData();
                    renderAllItems();
                    renderItems();
                    updateCounts();
                    showToast(`☁️ อัปเดตข้อมูลเรียบร้อยแล้ว`);
                }
            } catch (error) {
                console.error('Google Sync Error:', error);
            }
        }

        function filterCategory(cat) {
            activeCategory = cat;
            renderItems();
        }

        function saveData() {
            localStorage.setItem('my_closet_items', JSON.stringify(items));
            localStorage.setItem('my_closet_outfits', JSON.stringify(outfits));
        }

        function updateCounts() {
            document.getElementById('count-items').innerText = items.length;
            document.getElementById('count-outfits').innerText = outfits.length;
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-message').innerText = msg;
            toast.classList.remove('opacity-0', 'pointer-events-none');
            toast.classList.add('opacity-100');
            setTimeout(() => {
                toast.classList.add('opacity-0', 'pointer-events-none');
                toast.classList.remove('opacity-100');
            }, 2500);
        }
    </script>
</body>
</html>
